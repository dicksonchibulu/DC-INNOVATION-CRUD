<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DC INNOVATION | Product Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: #101827;
            color: white;
            padding: 25px 7%;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 8px;
            color: #cbd5e1;
        }

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .card, .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }

        .card h3 {
            color: #64748b;
            font-size: 14px;
        }

        .card p {
            margin-top: 12px;
            font-size: 25px;
            font-weight: bold;
        }

        .panel {
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 44px;
        }

        .form-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #172033;
        }

        .edit {
            background: #fef3c7;
            color: #92400e;
        }

        .delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
            color: #475569;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        #message {
            margin-bottom: 18px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            header {
                padding: 22px;
            }

            main {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>DC INNOVATION</h1>
    <p>Product Management System | Inventory Dashboard</p>
</header>

<main>

    <section class="summary">
        <div class="card">
            <h3>Total Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Total Stock Units</h3>
            <p id="totalStock">0</p>
        </div>

        <div class="card">
            <h3>Inventory Value</h3>
            <p id="inventoryValue">0</p>
        </div>
    </section>

    <section class="panel">
        <h2 id="formTitle">Add New Product</h2>

        <p id="message" role="status" aria-live="polite"></p>

        <form id="productForm">

            <div class="form-grid">

                <div>
                    <label for="product_name">Product Name</label>
                    <input
                        type="text"
                        id="product_name"
                        maxlength="150"
                        required
                    >
                </div>

                <div>
                    <label for="category">Category</label>
                    <input
                        type="text"
                        id="category"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label for="price">Price</label>
                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div>
                    <label for="quantity">Quantity</label>
                    <input
                        type="number"
                        id="quantity"
                        min="0"
                        step="1"
                        required
                    >
                </div>

                <div>
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        maxlength="500"
                    ></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="primary" id="saveButton">
                    Add Product
                </button>

                <button
                    type="button"
                    class="secondary"
                    id="cancelButton"
                    hidden
                >
                    Cancel Edit
                </button>
            </div>

        </form>
    </section>

    <section class="panel">
        <h2>Product Inventory</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="productTable">
                    <tr>
                        <td colspan="7">Loading products...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    &copy; 2026 DC INNOVATION. All rights reserved.
</footer>

<script src="app.js"></script>

</body>
</html>
